name: site

on:
  pull_request:
  push:
    branches: [main]
  # Hourly: a new Bonk release reaches the site within the hour; otherwise a full rebuild once a day.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  nouveau:
    name: nouveau
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      a_faire: ${{ steps.controle.outputs.a_faire }}
    steps:
      - name: Nouvelle version de Bonk ?
        id: controle
        env:
          EVENEMENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          derniere=$(gh release view --repo FantasmaGlad/Bonk --json tagName --jq '.tagName | ltrimstr("v")')
          publiee=$(curl -fsSL https://bonk-os.app/version.txt || true)
          if [ "$EVENEMENT" != schedule ] || [ "$derniere" != "$publiee" ] || [ "$(date -u +%H)" = 05 ]; then
            a_faire=true
          else
            a_faire=false
          fi
          echo "derniere=$derniere publiee=$publiee a_faire=$a_faire"
          echo "a_faire=$a_faire" >> "$GITHUB_OUTPUT"

  controle:
    name: controle
    needs: nouveau
    if: needs.nouveau.outputs.a_faire == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Bonkosapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # A pull request keeps the test release copied at install, so its checks do not depend on release timing.
      - name: Dernière version publiée
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/releases.mjs
      - name: Commandes de cette version
        run: node scripts/releases.mjs --sample && node scripts/commands.mjs
      - name: Commandes identiques à celles du dépôt
        if: github.event_name == 'pull_request'
        run: git diff --exit-code public/commands/index.html
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: Bonkosapp/dist
          # `.well-known/security.txt`: the action skips dot paths by default.
          include-hidden-files: true

  publication:
    name: publication
    if: github.event_name != 'pull_request'
    needs: controle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  menage:
    name: menage
    needs: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Garder les trois derniers déploiements
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/deployments?environment=github-pages&per_page=100" --jq '.[].id' \
            | tail -n +4 \
            | while read -r id; do
                gh api -X POST "repos/$GH_REPO/deployments/$id/statuses" -f state=inactive > /dev/null
                gh api -X DELETE "repos/$GH_REPO/deployments/$id"
              done
